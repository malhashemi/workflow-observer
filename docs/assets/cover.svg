    <text x="121" y="80" font-family="Geist Mono, monospace" font-size="12" letter-spacing="3" fill="#99AFB7">AGENT964 / OPEN SOURCE</text>
    <text x="56" y="184" font-size="76" letter-spacing="-4" font-weight="500" fill="#FCFCFC">Workflow</text>
    <text x="56" y="263" font-size="76" letter-spacing="-4" font-weight="500" fill="#FCFCFC">Observer<tspan fill="#3EEBFF">.</tspan></text>
    <text x="61" y="311" font-size="19" fill="#A0B5BD">Follow the work. Understand the cost.</text>
    <text x="61" y="338" font-size="19" fill="#A0B5BD">Trace it back to the evidence.</text>
