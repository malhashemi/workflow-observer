<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Observer</title>
  <desc id="desc">A local view of your Claude workflows, from planned phases to recorded evidence. Start with bunx workflow-observer.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#3EEBFF" stop-opacity=".12"/><stop offset="1" stop-color="#3EEBFF" stop-opacity="0"/></radialGradient>
