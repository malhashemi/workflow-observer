    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#A0B2B9" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1280" height="520" rx="20" fill="#031119"/>
  <rect x=".5" y=".5" width="1279" height="519" rx="19.5" stroke="#203640"/>
