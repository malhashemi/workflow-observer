name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun test
      - run: bun run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish to npm
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # npm trusted publishing requires a GitHub-hosted runner.
    # All dependency installation, builds and tests stay on Blacksmith above.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Check whether this version needs publishing
        id: package
        run: bun scripts/release-status.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.package.outputs.published == 'false'
        with:
          name: npm-package
          path: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.package.outputs.published == 'false'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the tested archive
        if: steps.package.outputs.published == 'false'
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          npm publish "release/$ARCHIVE" --access public --ignore-scripts --provenance
      - name: Create GitHub release
        if: steps.package.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "v$VERSION" "release/$ARCHIVE" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
